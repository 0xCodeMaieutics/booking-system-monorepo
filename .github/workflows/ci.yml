name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: Lint, script: lint }
          - { name: Format, script: format:check }
          - { name: Typecheck, script: typecheck }
          - { name: Knip, script: knip }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm ${{ matrix.check.script }}

  migrations:
    name: Migrations up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @tsami/db exec drizzle-kit check

      - run: pnpm --filter @tsami/db exec drizzle-kit generate < /dev/null

      - name: Fail if schema has unmigrated changes
        run: |
          changes=$(git status --porcelain -- packages/db/migrations)
          if [ -n "$changes" ]; then
            echo "::error::packages/db/src/schema.ts differs from packages/db/migrations. Run 'pnpm db:generate' and commit the result."
            echo "$changes"
            git diff -- packages/db/migrations
            exit 1
          fi

  migrate:
    name: Migrate database
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, migrations]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: db-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
